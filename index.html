ctx.restore();if(e!==p){ctx.fillStyle='#161821';ctx.fillRect(x-r,y-r-19,r*2,6);ctx.fillStyle=kind==='boss'?'#ff3b55':'#ff765d';ctx.fillRect(x-r,y-r-19,r*2*Math.max(0,e.hp/e.max),6)}}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}drawBackground();if(p)fighter(p,p.color,p.kind);enemies.forEach(e=>fighter(e,e.kind==='elite'?'#7637a6':'#7d2b35',e.kind));if(boss)fighter(boss,'#571d2b','boss');for(let q of particles){ctx.globalAlpha=Math.max(0,q.t/q.max);ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,q.size,q.size)}ctx.globalAlpha=1;ctx.restore()}
function levelClear(){playing=false;hud.style.display='none';if(level>=levels.length){end.style.display='flex';endtitle.textContent='🏆 START STOP CHAMPION!';endsub.textContent='You cleared all 5 levels and defeated the Rift Titan.';return}between.style.display='flex';betweenTitle.textContent=`LEVEL ${level} CLEAR!`;betweenText.textContent=`${levels[level-1].name} conquered. Next: ${levels[level].name}. Enemies will be faster, tougher, and hit harder.`;nextBtn.textContent=`START LEVEL ${level+1}`}
nextBtn.onclick=()=>{level++;beginLevel()};
function finish(win){playing=false;hud.style.display='none';end.style.display='flex';endtitle.textContent=win?'🏆 VICTORY!':'💥 TRY AGAIN';endsub.textContent=win?'You won!':'You reached Level '+level+'. The enemies get tougher each stage — try a different fighter or go again.'}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();if(playing)requestAnimationFrame(loop)}
// Character portraits on selection cards
function portrait(canvas,kind){let q=canvas.getContext('2d'),w=canvas.width=220,h=canvas.height=105;q.clearRect(0,0,w,h);let old=ctx,pOld=p;ctx=q;p={x:w/2,y:62,r:42,face:1,hp:100,max:100};fighter(p,chars[kind].color,kind);ctx=old;p=pOld}document.querySelectorAll('.card').forEach(card=>portrait(card.querySelector('canvas'),card.dataset.char));
draw();
</script></body></html>
